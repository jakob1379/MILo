[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tetra-nerf"
version = "0.1.1"
description = "Official implementation of Tetra-NeRF paper"
authors = [{ name = "Jonas Kulhanek", email = "jonas.kulhanek@live.com" }]
requires-python = ">=3.7"
dependencies = ["trimesh>=3.20.2"]

[tool.setuptools.packages.find]
include = ["tetranerf*"]

[tool.setuptools.package-data]
"tetranerf.utils.extension" = ["py.typed", "**/*.pyi"]
